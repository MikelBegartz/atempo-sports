<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ t('register_closed_title') }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=auth3" />
</head>
<body class="login-page">
  <div class="login-shell">
    <section class="login-brand">
      <p class="login-kicker">{{ t('login_kicker') }}</p>
      <h1 class="login-logo">AtempoSports</h1>
      <p class="login-lead">{{ t('login_lead') }}</p>
    </section>
    <section class="login-panel">
      <h2>{{ t('register_closed_heading') }}</h2>
      <p class="muted">{{ t('register_closed_body') }}</p>
      <p class="login-extra">
        <a class="text-action" href="/login">{{ t('register_go_login') }}</a>
        ·
        <a class="text-action" href="/privacitat">{{ t('privacy_link') }}</a>
      </p>
      <nav class="lang-switch" aria-label="{{ t('lang_label') }}">
        {% for code, meta in langs.items() %}
          {% set label = meta[0] %}
          {% set mark = meta[1] %}
          <a href="/lang/{{ code }}?next=/register" class="lang-mark{% if code == lang %} is-active{% endif %}" title="{{ label }}">{{ mark }}</a>
        {% endfor %}
      </nav>
    </section>
  </div>
</body>
</html>
